name: source-checks-and-builds

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-tests:
    name: Server protocol tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server requirements
        run: python -m pip install -r server/requirements.txt
      - name: Run protocol smoke test
        run: python tools/smoke_test.py
      - name: Compile host server and settings manager
        run: python -m py_compile server/host.py server/settings_app.py
      - name: Check scroll behavior in host manager and shared client
        run: python tools/ui_scroll_checks.py
      - name: Check host manager and chat scroll invariants
        run: python tools/ui_scroll_check.py

  windows-app-build:
    name: Build Windows portable EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: windows-app/electron/package-lock.json
      - name: Install Windows client dependencies
        working-directory: windows-app/electron
        run: npm ci --no-audit --no-fund
      - name: Validate shared client JavaScript
        run: node --check server/web/app.js
      - name: Validate Windows Electron JavaScript
        run: node --check windows-app/electron/main.js
      - name: Build portable Windows app
        working-directory: windows-app/electron
        run: npm run build
      - name: Verify Windows artifact
        shell: pwsh
        run: |
          $exe = "windows-app/electron/dist/TerminusSecrets.exe"
          if (-not (Test-Path $exe)) { throw "Windows EXE was not produced: $exe" }
          Get-FileHash $exe -Algorithm SHA256
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: TerminusSecrets-Windows
          path: windows-app/electron/dist/TerminusSecrets.exe
          if-no-files-found: error
          retention-days: 14

  android-app-build:
    name: Build Android APK
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Android command-line SDK
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP "android-sdk"
          $zip = Join-Path $env:RUNNER_TEMP "commandlinetools-win.zip"
          $unpack = Join-Path $env:RUNNER_TEMP "android-cmdline-tools"
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/commandlinetools-win-13114758_latest.zip" -OutFile $zip
          if (Test-Path $unpack) { Remove-Item $unpack -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $unpack -Force
          $tools = Join-Path $sdk "cmdline-tools/latest"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Copy-Item (Join-Path $unpack "cmdline-tools/*") $tools -Recurse -Force
          "ANDROID_HOME=$sdk" >> $env:GITHUB_ENV
          "ANDROID_SDK_ROOT=$sdk" >> $env:GITHUB_ENV
          "$tools/bin" >> $env:GITHUB_PATH
          $sdkmanager = Join-Path $tools "bin/sdkmanager.bat"
          1..30 | ForEach-Object { "y" } | & $sdkmanager "--sdk_root=$sdk" --licenses
          if ($LASTEXITCODE -ne 0) { throw "Android SDK license acceptance failed." }
          & $sdkmanager "--sdk_root=$sdk" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          if ($LASTEXITCODE -ne 0) { throw "Android SDK package installation failed." }
      - name: Configure APK signing
        shell: pwsh
        env:
          TERMINUS_KEYSTORE_BASE64: ${{ secrets.TERMINUS_KEYSTORE_BASE64 }}
          TERMINUS_APK_SIGNING_PASSWORD: ${{ secrets.TERMINUS_APK_SIGNING_PASSWORD }}
        run: |
          $keystore = Join-Path $env:GITHUB_WORKSPACE "android-app/keystore/terminus-release.p12"
          if ($env:TERMINUS_KEYSTORE_BASE64 -and $env:TERMINUS_APK_SIGNING_PASSWORD) {
            New-Item -ItemType Directory -Force -Path (Split-Path $keystore) | Out-Null
            [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:TERMINUS_KEYSTORE_BASE64))
            "TERMINUS_KEYSTORE_PATH=$keystore" >> $env:GITHUB_ENV
            "TERMINUS_APK_SIGNING_PASSWORD=$env:TERMINUS_APK_SIGNING_PASSWORD" >> $env:GITHUB_ENV
            "TERMINUS_APK_STABLE_SIGNING=true" >> $env:GITHUB_ENV
          } else {
            # A temporary key allows CI to validate and package the APK, but it
            # cannot update an install signed with a different key.
            "TERMINUS_APK_SIGNING_PASSWORD=Temporary-CI-Signing-2026!" >> $env:GITHUB_ENV
            "TERMINUS_APK_STABLE_SIGNING=false" >> $env:GITHUB_ENV
          }
      - name: Build Android APK
        shell: pwsh
        run: ./android-app/build-apk.ps1
      - name: Verify Android artifact and document signing
        shell: pwsh
        run: |
          $apk = "android-app/TerminusSecrets.apk"
          if (-not (Test-Path $apk)) { throw "Android APK was not produced: $apk" }
          & "$env:ANDROID_HOME/build-tools/36.0.0/apksigner.bat" verify --print-certs $apk
          Get-FileHash $apk -Algorithm SHA256
          if ($env:TERMINUS_APK_STABLE_SIGNING -ne "true") {
            @(
              "CI signing note:"
              "This APK was signed with a temporary CI key because stable signing secrets were not configured."
              "To install it over an existing copy signed with another key, Android will require uninstalling the old app first."
              "Configure repository secrets TERMINUS_KEYSTORE_BASE64 and TERMINUS_APK_SIGNING_PASSWORD to preserve the same signing identity across builds."
            ) | Set-Content "android-app/SIGNING-NOTE.txt"
          } else {
            "This APK uses the configured persistent signing key." | Set-Content "android-app/SIGNING-NOTE.txt"
          }
      - name: Upload Android app
        uses: actions/upload-artifact@v4
        with:
          name: TerminusSecrets-Android-APK
          path: |
            android-app/TerminusSecrets.apk
            android-app/SIGNING-NOTE.txt
          if-no-files-found: error
          retention-days: 14

  windows-source-check:
    name: Windows client source check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Windows client dependencies
        working-directory: windows-app/electron
        run: npm ci --no-audit --no-fund
      - name: Validate Electron package metadata
        working-directory: windows-app/electron
        run: node -e "const p=require('./package.json'); if(!p.main || !p.scripts || !p.scripts.start) process.exit(1); console.log(p.name, p.version)"
      - name: Validate shared web client JavaScript syntax
        run: node --check server/web/app.js
      - name: Validate Windows Electron JavaScript syntax
        run: node --check windows-app/electron/main.js


  host-manager-build:
    name: Build standalone Windows host manager
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install host runtime and packager
        run: python -m pip install -r server/requirements.txt pyinstaller
      - name: Compile host and GUI manager
        run: python -m py_compile server/host.py server/settings_app.py
      - name: Package host executable with shared web assets
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name TerminusSecretsHost --add-data "server/web;web" server/host.py
      - name: Package graphical host manager
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name TerminusSecretsHostManager server/settings_app.py
          if (-not (Test-Path "dist/TerminusSecretsHost.exe")) { throw "Host executable is missing." }
          if (-not (Test-Path "dist/TerminusSecretsHostManager.exe")) { throw "Host manager executable is missing." }
          Get-FileHash "dist/TerminusSecretsHost.exe" -Algorithm SHA256
          Get-FileHash "dist/TerminusSecretsHostManager.exe" -Algorithm SHA256
      - name: Upload standalone host app
        uses: actions/upload-artifact@v4
        with:
          name: TerminusSecrets-Host-Manager-Windows
          path: |
            dist/TerminusSecretsHostManager.exe
            dist/TerminusSecretsHost.exe
          if-no-files-found: error
          retention-days: 14
