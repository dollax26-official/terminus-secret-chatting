name: source-checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-tests:
    name: Server protocol tests (source only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server requirements
        run: python -m pip install -r server/requirements.txt
      - name: Run protocol smoke test
        run: python tools/smoke_test.py
      - name: Compile host server
        run: python -m py_compile server/host.py

  windows-source-check:
    name: Windows client source check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Windows client dependencies
        working-directory: windows-app/electron
        run: npm ci --no-audit --no-fund
      - name: Validate Electron package metadata
        working-directory: windows-app/electron
        run: node -e "const p=require('./package.json'); if(!p.main || !p.scripts || !p.scripts.start) process.exit(1); console.log(p.name, p.version)"

      - name: Check Electron main-process syntax
        run: node --check windows-app/electron/main.js

      - name: Check shared UI selection and copy/paste
        run: node tools/ui_source_check.js

# Deliberately does not build, upload, or attach APK/EXE files. Build locally with
# android-app/build-apk.ps1 and windows-app/electron/build-exe.ps1.
